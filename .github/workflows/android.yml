name: Android CI and Release
on:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Android candidate version for artifact-only validation
        required: true
        type: string
        default: '1.0.6+85'
      publish_only:
        description: Publish already verified candidate artifacts
        type: boolean
        default: false
      upload_draft_only:
        description: Upload verified Android artifacts to an existing draft
        type: boolean
        default: false
      source_sha:
        description: Candidate source commit
        type: string
        default: ''
      android_run:
        description: Android candidate run ID
        type: string
        default: ''
      bridge_tag:
        description: Optional legacy Android stable bridge tag
        type: string
        default: ''
      windows_run:
        description: Windows candidate run ID
        type: string
        default: ''
      include_windows:
        description: Build and publish Windows artifacts in parallel
        type: boolean
        default: true
  push:
    branches: [main, 'integration/**']
    # Android 产品线固定 0.x 号段；Windows 的 1.x tag 不应触发 Android 构建。
    tags: ['v0.*']
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  FLUTTER_VERSION: '3.47.1'
  GO_VERSION: '1.26.4'
  NDK_VERSION: r28c
jobs:
  build:
    if: github.ref != 'refs/tags/v0.3.4' && (github.event_name != 'workflow_dispatch' || (!inputs.publish_only && !inputs.upload_draft_only))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive, fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-go@v5
        with: {go-version: '${{ env.GO_VERSION }}', cache-dependency-path: core/go.sum}
      - uses: subosito/flutter-action@v2
        with: {channel: master, flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true}
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: {ndk-version: '${{ env.NDK_VERSION }}', add-to-path: true, link-to-sdk: true}
      - name: Set isolated candidate package version
        if: github.event_name == 'workflow_dispatch'
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?\+[0-9]+$ ]]
          export CANDIDATE_VERSION
          yq -i '.version = strenv(CANDIDATE_VERSION)' pubspec.yaml
      - run: flutter pub get
      - name: Prepare verified SQLite assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tool/tests -p 'test_prepare_sqlite_assets.py'
          sqlite_version=$(yq -r '.packages.sqlite3.version' pubspec.lock)
          [[ "$sqlite_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 tool/prepare_sqlite_assets.py \
            --package "$HOME/.pub-cache/hosted/pub.dev/sqlite3-$sqlite_version" \
            --cache .dart_tool/hooks_runner/shared/sqlite3/build
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: dart run tool/verify_release_tag.dart --tag "${{ github.ref_name }}" --platform android
      - name: Verify candidate release identity
        if: github.event_name == 'workflow_dispatch'
        run: dart run tool/verify_release_tag.dart --tag "v${CANDIDATE_VERSION%%+*}" --platform android
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
      - run: dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart
      - run: flutter analyze --no-fatal-infos
      - name: Test
        run: |
          cp pubspec.yaml /tmp/bfclash-pubspec.yaml
          trap 'cp /tmp/bfclash-pubspec.yaml pubspec.yaml' EXIT
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          flutter test --reporter compact
      - name: Test Tailscale ADB isolation
        run: |
          cd core
          CGO_ENABLED=0 go test -tags=with_gvisor . -run '^Test(ADBForward|StopADBForward)' -count=1
      - name: Build
        env: {ANDROID_NDK_HOME: '${{ steps.ndk.outputs.ndk-path }}'}
        run: |
          set +e
          mkdir -p android/app/keystore
          git show 8303c19:client/android/app/keystore/release.keystore > android/app/keystore/release.keystore
          git show 8303c19:client/android/app/build.gradle.kts > /tmp/bfclash-legacy-signing.gradle.kts
          export BFCLASH_STORE_PASSWORD=$(grep -m1 storePassword /tmp/bfclash-legacy-signing.gradle.kts | cut -d= -f2- | xargs)
          export BFCLASH_KEY_ALIAS=$(grep -m1 keyAlias /tmp/bfclash-legacy-signing.gradle.kts | cut -d= -f2- | xargs)
          export BFCLASH_KEY_PASSWORD=$(grep -m1 keyPassword /tmp/bfclash-legacy-signing.gradle.kts | cut -d= -f2- | xargs)
          test -n "$BFCLASH_STORE_PASSWORD" -a -n "$BFCLASH_KEY_ALIAS" -a -n "$BFCLASH_KEY_PASSWORD"
          build_env=stable
          version_name=$(yq -r '.version' pubspec.yaml)
          case "$version_name" in
            *-*) build_env=pre ;;
          esac
          dart setup.dart android --env "$build_env" -v 2>&1 | tee /tmp/bfclash-android-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            diagnostic=$(grep -Ei "error:|exception:|failed|failure|what went wrong|could not|no such file|not found" /tmp/bfclash-android-build.log | tail -n 12 | paste -sd " " - | sed "s/%/%25/g")
            echo "::error title=Android build diagnostic::${diagnostic:-Build failed without a matching diagnostic line}"
          fi
          exit "$status"
      - name: Native regression tests
        env: {ANDROID_NDK_HOME: '${{ steps.ndk.outputs.ndk-path }}'}
        run: cd android && ./gradlew :service:testDebugUnitTest :app:testDebugUnitTest -Ptarget-platform=android-arm64 -x :app:compileFlutterBuildDebug --console=plain
      - name: Package
        run: |
          mkdir -p release
          find dist -type f -name '*.apk' -exec cp {} release/ \;
          test -n "$(find release -maxdepth 1 -type f -name '*.apk' -print -quit)"
      - name: Verify signed packages
        shell: bash
        run: |
          set -euo pipefail
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          mkdir -p package-checks
          version=$(sed -n 's/^version: \(.*\)+[0-9]*$/\1/p' pubspec.yaml)
          build=$(sed -n 's/^version: .*+\([0-9]*\)$/\1/p' pubspec.yaml)
          test -n "$version" -a -n "$build"
          package_id=com.bfclash.client
          # 与 android/app/build.gradle.kts 的 isBeta 一致：只有 beta 用测试包名。
          # rc 是正式版的候选构建，打正式包名，才能被同号正式版覆盖升级。
          case "${version,,}" in
            *-beta.*) package_id=com.lansway.client.beta ;;
          esac
          for abi in arm64-v8a armeabi-v7a x86_64; do
            case "$abi" in
              arm64-v8a) code=$((2000 + build)) ;;
              armeabi-v7a) code=$((1000 + build)) ;;
              x86_64) code=$((4000 + build)) ;;
            esac
            mapfile -t apks < <(find release -maxdepth 1 -type f -name "*${abi}*.apk")
            test "${#apks[@]}" -eq 1
            apk="${apks[0]}"
            "$signer" verify --print-certs "$apk" > "package-checks/$abi-signature.txt" 2>&1
            cert=$(awk -F ': ' '/^Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' "package-checks/$abi-signature.txt" | tr -d '[:space:]')
            test "$cert" = 89fe6df0d3e4c4017d9fd0cf55d7fc4cc2a6723d28e764648aec1ae0106f9d31
            "$aapt" dump badging "$apk" > "package-checks/$abi-badging.txt"
            grep -F "name='$package_id'" "package-checks/$abi-badging.txt"
            grep -F "versionCode='$code'" "package-checks/$abi-badging.txt"
            grep -F "versionName='$version'" "package-checks/$abi-badging.txt"
            grep -F "native-code: '$abi'" "package-checks/$abi-badging.txt"
          done
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with: {name: bfclash-android, path: 'release/*'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            build/**/test-results/**
            package-checks/*
  release:
    if: startsWith(github.ref, 'refs/tags/v0.')
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: bfclash-android, path: release}
      - name: Resolve release identity
        id: identity
        run: |
          version="${GITHUB_REF_NAME#v}"
          channel=""
          prerelease=false
          # 只有 beta 在标题上标 Beta。rc 的版本号本身带 -rc.N，一眼可辨，
          # 且它属于正式版主线（同一安装身份），不该冒充测试通道。
          case "$version" in
            *-beta.*) channel="Beta "; prerelease=true ;;
            *-rc.*) prerelease=true ;;
          esac
          echo "title=BfClash Android ${channel}${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: 'release/*'
          name: ${{ steps.identity.outputs.title }}
          prerelease: ${{ steps.identity.outputs.prerelease }}
          make_latest: ${{ steps.identity.outputs.prerelease == 'false' }}
          generate_release_notes: true

  build_windows:
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_only && !inputs.upload_draft_only && inputs.candidate_version != '' && (inputs.include_windows == true || inputs.include_windows == '')
    name: Probe Windows AMD64 Build
    runs-on: windows-2022
    steps:
      - name: Enable longpaths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Verify installer cancellation and confirmed cleanup
        run: ./tool/check_windows_uninstall.ps1

      - name: Verify transactional update rollback and health gates
        run: |
          ./tool/check_windows_portable_update.ps1
          ./tool/check_windows_update_health.ps1
          ./tool/check_windows_update_payload.ps1

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Update Channel and Architecture Tests
        run: flutter test test/common/android_update_identity_test.dart test/common/windows_update_policy_test.dart test/setup_test.dart test/common/request_test.dart test/common/request_beta_update_test.dart test/common/windows_update_test.dart test/common/windows_update_migration_test.dart test/common/windows_update_strategy_test.dart test/common/windows_portable_update_test.dart test/common/windows_update_health_test.dart test/common/windows_update_download_test.dart test/common/resumable_download_test.dart test/common/resumable_download_process_test.dart test/common/update_test.dart test/common/windows_preferences_test.dart test/common/loopback_test.dart

      - name: Run Desktop Navigation Flow Widget Tests
        run: flutter test test/views/desktop_navigation_flow_test.dart test/views/desktop_dashboard_visual_test.dart test/common/desktop_style_test.dart test/widgets/desktop_settings_list_test.dart test/widgets/profile_focus_test.dart test/widgets/edit_profile_focus_test.dart test/widgets/proxies_tab_test.dart test/views/proxies_group_offsets_test.dart test/pages/home_test.dart test/common/window_position_test.dart test/common/window_test.dart

      - name: Run Desktop Shared Core Integration Tests
        run: flutter test test/core/interface_message_test.dart test/views/desktop_shared_core_integration_test.dart test/widgets/desktop_connection_row_test.dart test/widgets/connection_actions_test.dart test/widgets/connections_view_test.dart test/views/logs_view_test.dart test/common/filter_test.dart test/models/rule_test.dart test/models/config_test.dart test/views/connections_test.dart test/views/requests_test.dart test/views/desktop_connection_polling_flow_test.dart test/widgets/connection_item_test.dart test/models/common_test.dart

      - name: Run Desktop Sub-Store Lifecycle Tests
        run: flutter test test/views/sub_store_backend_service_test.dart test/views/sub_store_status_test.dart test/providers/system_action_test.dart

      - name: Run Backup and WebDAV UI Tests
        run: flutter test test/views/webdav_roundtrip_test.dart test/views/backup_and_restore_test.dart test/providers/backup_action_test.dart test/common/dav_client_test.dart test/common/webdav_test.dart test/common/backup_task_test.dart

      - name: Run Beta WebDAV UI Roundtrip
        run: flutter test --dart-define=APP_BETA=true test/views/webdav_roundtrip_test.dart

      - name: Run Core Setup and TUN Authorization Tests
        run: flutter test test/providers/setup_action_test.dart

      - name: Run Windows Build Probe via setup.dart
        run: dart setup.dart windows --env stable --targets exe,zip -v

      - name: Verify stable packaged version
        run: ./tool/check_windows_package_version.ps1 -Executable build/windows/x64/runner/Release/BfClash.exe

      - name: Verify stable native payload can load
        run: ./tool/check_windows_update_payload.ps1 -BundlePath (Resolve-Path build/windows/x64/runner/Release)

      - name: Run Windows Native Proxy Tests
        run: |
          cmake -S windows -B build/windows/x64 -Dinclude_proxy_tests=ON
          if ($LASTEXITCODE -ne 0) { throw "Native proxy test configuration failed" }
          cmake --build build/windows/x64 --config Release --target proxy_test
          if ($LASTEXITCODE -ne 0) { throw "Native proxy test build failed" }
          & ./build/windows/x64/plugins/proxy/Release/proxy_test.exe
          if ($LASTEXITCODE -ne 0) { throw "Native proxy tests failed" }

      - name: Test packaged Windows Sub-Store
        run: ./tool/check_windows_substore.ps1 -BundlePath (Resolve-Path build/windows/x64/runner/Release)

      - name: Preserve stable probe artifacts
        run: |
          New-Item -ItemType Directory -Path dist/stable -Force | Out-Null
          Get-ChildItem -Path dist -File | Move-Item -Destination dist/stable

      - name: Reset build state before beta probe
        run: |
          flutter clean
          flutter pub get
      - name: Select isolated beta installer identity
        run: Copy-Item windows/packaging/exe/make_config.beta.yaml windows/packaging/exe/make_config.yaml -Force

      - name: Set isolated beta candidate version
        if: github.event_name == 'workflow_dispatch' && inputs.candidate_version != ''
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        shell: pwsh
        run: |
          if ($env:CANDIDATE_VERSION -notmatch '^\d+\.\d+\.\d+(-beta\.\d+)?\+\d+$') { throw 'Invalid candidate version' }
          $content = Get-Content pubspec.yaml -Raw
          $updated = [regex]::Replace($content, '(?m)^version:\s*\S+\s*$', "version: $env:CANDIDATE_VERSION", 1)
          if ($updated -eq $content) { throw 'Could not set candidate version' }
          [System.IO.File]::WriteAllText((Resolve-Path pubspec.yaml), $updated)

      - name: Run Windows Beta Build Probe via setup.dart
        run: dart setup.dart windows --env pre --targets exe,zip -v

      - name: Verify beta packaged version
        run: ./tool/check_windows_package_version.ps1 -Executable build/windows/x64/runner/Release/BfClash-Beta.exe -Beta

      - name: Verify beta native payload can load
        run: ./tool/check_windows_update_payload.ps1 -BundlePath (Resolve-Path build/windows/x64/runner/Release)

      - name: Test packaged beta Windows Sub-Store
        run: ./tool/check_windows_substore.ps1 -BundlePath (Resolve-Path build/windows/x64/runner/Release)

      - name: Preserve beta probe artifacts
        run: |
          New-Item -ItemType Directory -Path dist/beta -Force | Out-Null
          Get-ChildItem -Path dist -File | Move-Item -Destination dist/beta

      - name: List Artifacts
        if: always()
        run: |
          Get-ChildItem -Path dist -Recurse -ErrorAction SilentlyContinue

      - name: Upload Windows Probe Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bfclash-windows-probe
          path: |
            dist/
            .dart_tool/setup_build_cache/
            hook.log
            build/windows/

  publish_candidate:
    if: |
      always() && !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      (
        inputs.publish_only == true ||
        (
          inputs.upload_draft_only != true &&
          inputs.candidate_version != '' &&
          needs.build.result == 'success' &&
          (inputs.include_windows == false || needs.build_windows.result == 'success')
        )
      )
    needs: [build, build_windows]
    permissions: {actions: read, contents: write}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify candidate source and build results (External Run Mode)
        if: inputs.publish_only
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ANDROID_RUN: ${{ inputs.android_run }}
          WINDOWS_RUN: ${{ inputs.windows_run }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$ANDROID_RUN" =~ ^[0-9]+$ && "$WINDOWS_RUN" =~ ^[0-9]+$ ]]
          for entry in "$ANDROID_RUN:android.yml" "$WINDOWS_RUN:windows-probe.yml"; do
            id=${entry%%:*}; workflow=${entry#*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" | jq -e --arg sha "$SOURCE_SHA" --arg wf "$workflow" '.head_sha == $sha and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and (.path | endswith("/" + $wf))'
          done
      - name: Download external candidate packages
        if: inputs.publish_only
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RUN: ${{ inputs.android_run }}
          WINDOWS_RUN: ${{ inputs.windows_run }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate/android candidate/windows
          gh run download "$ANDROID_RUN" -n bfclash-android -D candidate/android
          gh run download "$WINDOWS_RUN" -n bfclash-windows-probe -D candidate/windows
      - name: Download internal candidate packages (Unified Mode)
        if: '!inputs.publish_only'
        uses: actions/download-artifact@v4
        with:
          path: candidate
      - name: Normalize internal artifact directories
        if: '!inputs.publish_only'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate/android candidate/windows
          if [[ -d candidate/bfclash-android ]]; then
            cp -r candidate/bfclash-android/* candidate/android/
          fi
          if [[ -d candidate/bfclash-windows-probe ]]; then
            cp -r candidate/bfclash-windows-probe/* candidate/windows/
          fi
      - name: Inspect and assemble packages
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          (cd candidate/android && sha256sum -c SHA256SUMS.txt)
          version=${CANDIDATE_VERSION%+*}
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f="candidate/android/BfClash-$version-android-$abi.apk"
            test -s "$f"
            cp "$f" public/
          done
          if [[ -d candidate/windows/dist ]]; then
            for ext in setup.exe zip; do
              f="candidate/windows/dist/stable/BfClash-$version-windows-amd64-$ext"
              if [[ "$ext" == zip ]]; then f="candidate/windows/dist/stable/BfClash-$version-windows-amd64.zip"; fi
              if [[ ! -f "$f" ]]; then
                f="candidate/windows/dist/beta/BfClash-$version-windows-amd64-$ext"
                if [[ "$ext" == zip ]]; then f="candidate/windows/dist/beta/BfClash-$version-windows-amd64.zip"; fi
              fi
              test -s "$f"
              cp "$f" public/
            done
          fi
          (cd public && sha256sum * > SHA256SUMS.txt)
      - name: Resolve release version and channel
        id: version
        shell: bash
        run: |
          version=${CANDIDATE_VERSION%+*}
          prerelease=false
          channel=""
          bridge_title="BfClash Android 正式版更新兼容入口"
          case "$version" in
            *-beta.*) channel="Beta "; prerelease=true; bridge_title="BfClash Android Beta 更新兼容入口" ;;
            *-rc.*) channel="RC "; prerelease=true; bridge_title="BfClash Android RC 更新兼容入口" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "bridge_title=$bridge_title" >> "$GITHUB_OUTPUT"
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ inputs.source_sha != '' && inputs.source_sha || github.sha }}
          name: BfClash ${{ steps.version.outputs.channel }}${{ steps.version.outputs.version }} — 网络检测 IP 隐私保护
          body: |
            BfClash ${{ steps.version.outputs.version }} 发布说明：
            - 仪表盘「网络检测」新增公网 IP 隐私保护显隐切换（支持点击小眼睛在真实 IP 与脱敏掩码间切换，偏好自动持久化保存）
            - 同步最新上游内核与稳定性优化
            - 统一正式版本发布，包含 Windows 与 Android 全架构安装包
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.prerelease == 'false' }}
          files: public/*
      - name: Publish legacy Android update bridge
        if: inputs.bridge_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.bridge_tag }}
          target_commitish: ${{ inputs.source_sha != '' && inputs.source_sha || github.sha }}
          name: ${{ steps.version.outputs.bridge_title }}
          body: |
            这是旧版 Android 客户端的更新兼容入口。此处 APK 与 BfClash Android ${{ steps.version.outputs.version }} 完全相同，安装后显示的实际版本为 ${{ steps.version.outputs.version }}；兼容标签仅用于让旧版 0.x 客户端发现并升级到新版。
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: false
          files: public/*.apk

  upload_android_draft:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_draft_only && !inputs.publish_only
    runs-on: ubuntu-latest
    permissions: {actions: read, contents: write}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and upload Android artifacts to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          ANDROID_RUN: ${{ inputs.android_run }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          BRIDGE_TAG: ${{ inputs.bridge_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$ANDROID_RUN" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?\+[0-9]+$ ]]
          version=${CANDIDATE_VERSION%+*}
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ANDROID_RUN" | jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success" and (.path | endswith("/android.yml"))'
          release_tag="v$version"
          if [[ -n "$BRIDGE_TAG" ]]; then
            [[ "$BRIDGE_TAG" == 'v0.3.4' && "$version" == '1.0.4' ]]
            release_tag="$BRIDGE_TAG"
          fi
          gh release view "$release_tag" --json isDraft,targetCommitish | jq -e --arg sha "$SOURCE_SHA" '.isDraft and .targetCommitish == $sha'
          mkdir -p candidate
          gh run download "$ANDROID_RUN" -n bfclash-android -D candidate
          (cd candidate && sha256sum -c SHA256SUMS.txt)
          for abi in arm64-v8a armeabi-v7a x86_64; do test -s "candidate/BfClash-$version-android-$abi.apk"; done
          gh release upload "$release_tag" candidate/*
