name: Android VPN recovery validation
on:
  push:
    branches: [fix/android-vpn-recovery-20261015]
permissions:
  contents: read
concurrency:
  group: vpn-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: '3.47.1'
          cache: true
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true
      - run: flutter pub get
      - name: Build signed beta
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          mkdir -p android/app/keystore
          git show 8303c19:client/android/app/keystore/release.keystore > android/app/keystore/release.keystore
          git show 8303c19:client/android/app/build.gradle.kts > /tmp/bfclash-legacy-signing.gradle.kts
          export BFCLASH_STORE_PASSWORD=$(grep -m1 storePassword /tmp/bfclash-legacy-signing.gradle.kts | cut -d= -f2- | xargs)
          export BFCLASH_KEY_ALIAS=$(grep -m1 keyAlias /tmp/bfclash-legacy-signing.gradle.kts | cut -d= -f2- | xargs)
          export BFCLASH_KEY_PASSWORD=$(grep -m1 keyPassword /tmp/bfclash-legacy-signing.gradle.kts | cut -d= -f2- | xargs)
          flutter build apk --release --split-per-abi --dart-define=APP_ENV=pre
      - uses: actions/upload-artifact@v4
        with:
          name: bfclash-vpn-recovery-raw
          path: build/app/outputs/flutter-apk/*.apk
      - name: Verify upgrade packages
        shell: bash
        run: |
          set -euo pipefail
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$signer" -a -x "$aapt"
          mkdir -p release package-checks
          for abi in arm64-v8a armeabi-v7a x86_64; do
            case "$abi" in
              arm64-v8a) code=2057 ;;
              armeabi-v7a) code=1057 ;;
              x86_64) code=4057 ;;
            esac
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            if ! "$signer" verify --print-certs "$apk" > "package-checks/$abi-signature.txt" 2>&1; then
              cat "package-checks/$abi-signature.txt"
              exit 1
            fi
            cat "package-checks/$abi-signature.txt"
            cert=$(awk -F ': ' '/^Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' "package-checks/$abi-signature.txt" | tr -d '[:space:]')
            test "$cert" = 89fe6df0d3e4c4017d9fd0cf55d7fc4cc2a6723d28e764648aec1ae0106f9d31
            "$aapt" dump badging "$apk" > "package-checks/$abi-badging.txt"
            head -1 "package-checks/$abi-badging.txt"
            grep -F "native-code:" "package-checks/$abi-badging.txt"
            grep -F "name='com.lansway.client.beta'" "package-checks/$abi-badging.txt"
            grep -F "versionCode='$code'" "package-checks/$abi-badging.txt"
            grep -F "versionName='0.2.28-beta.1'" "package-checks/$abi-badging.txt"
            grep -F "native-code: '$abi'" "package-checks/$abi-badging.txt"
            cp "$apk" "release/BfClash-0.2.28-beta.1-android-$abi.apk"
          done
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: bfclash-vpn-recovery-android
          path: release/*
      - name: Native regression tests
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cd android && ./gradlew :service:testDebugUnitTest :app:testDebugUnitTest -Ptarget-platform=android-arm64 -x :app:compileFlutterBuildDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpn-recovery-test-results
          path: |
            build/**/test-results/**
            package-checks/*
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bfclash-vpn-recovery-android
          path: release
      - name: Publish Android beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.2.28-beta.1 release/* --target "$GITHUB_SHA" --title 'BfClash 0.2.28-beta.1 · Android VPN 恢复测试版' --notes-file docs/releases/0.2.28-beta.1.md --prerelease --latest=false
