name: CI Baseline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for sensitive patterns
        run: |
          echo "Scanning workspace for leaked secrets and private configs..."
          # Check for private keys, tokens, sensitive credentials
          FOUND=0
          if grep -rnEI '(ghp_[A-Za-z0-9_]{36}|BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})' --exclude-dir={.git,build} .; then
            echo "Potential secret found!"
            FOUND=1
          fi
          # Check for real subscription links or node credentials
          if grep -rnEI '(vmess|vless|trojan|ss)://' --exclude-dir={.git,build} .; then
            echo "Real proxy node URI found!"
            FOUND=1
          fi
          if [ $FOUND -ne 0 ]; then
            echo "Secret scan failed."
            exit 1
          fi
          echo "Secret scan passed."

  build-and-test:
    name: Flutter Lint, Test & Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: actions/setup-flutter@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify tool versions
        working-directory: client
        run: |
          flutter --version
          java -version

      - name: Get Flutter dependencies
        working-directory: client
        run: flutter pub get

      - name: Check code formatting
        working-directory: client
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter project
        working-directory: client
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: client
        run: flutter test

      - name: Build Android Debug APK
        working-directory: client
        run: flutter build apk --debug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lansway-debug-apk
          path: client/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
