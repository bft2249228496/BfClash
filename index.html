<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Android · Design Preview</title>
  <link id="app-favicon" rel="icon" type="image/svg+xml" href="/assets/lansway.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="advanced.css">
  <link rel="stylesheet" href="brand.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <aside class="studio">
    <a class="brand" href="#" data-brand-link>
      <img class="brand-icon" data-brand-icon src="/assets/lansway.svg" alt="">
      <span class="brand-wordmark"><strong data-brand-name></strong><small data-brand-english></small></span>
      <span class="edition">ANDROID CONCEPT</span>
    </a>
    <div class="intro">
      <span class="eyebrow">YOUR NETWORK. YOUR WAY.</span>
      <h1>连接世界，<br>简单一点。</h1>
      <p>熟悉的代理体验，新的移动表达。<br>轻盈、清晰，也让每一次连接尽在掌握。</p>
      <div class="version"><i></i> Android 界面探索 <span>03 / Gemini</span></div>
    </div>
    <div class="design-notes">
      <div><b>01</b><span>轻量信息，清晰呈现</span></div>
      <div><b>02</b><span>常用操作，触手可及</span></div>
      <div><b>03</b><span>熟悉内核，全新体验</span></div>
    </div>
    <footer>INSPIRED BY CLASH PARTY <span>DESIGN PREVIEW · 2026</span></footer>
  </aside>
  <main class="preview">
    <div class="preview-tools"><span><i></i> 交互原型</span><button id="theme" aria-label="切换明暗外观"><span data-ui-icon="moon"></span><span>切换外观</span></button></div>
    <div class="phone">
      <div class="statusbar"><b>9:41</b><span class="camera"></span><span>▂▄▆ &nbsp;◔ &nbsp;▰</span></div>
      <header>
        <div class="appbrand"><img class="brand-icon" data-brand-icon src="/assets/lansway.svg" alt=""><b data-brand-name></b><span class="brand-platform" data-brand-english></span></div>
        <button class="icon-btn" id="notice" aria-label="查看通知"><span data-ui-icon="bell"></span><i></i></button>
      </header>
      <div id="screen"></div>
      <nav id="nav"></nav>
      <div class="gesture"></div>
      <div class="toast" id="toast" role="status"></div>
      <div id="modal"></div>
    </div>
    <p class="preview-caption">点击体验页面与状态 <span>·</span> 所有网络数据均为演示</p>
  </main>
  <script src="/brand-config.js"></script>
  <script src="brand.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script src="advanced.js"></script>
  <script src="theme.js"></script>
</body>
</html>
